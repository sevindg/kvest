<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квест «Таблица умножения на 6» — Rebotica</title>
<style>
  @font-face {
    font-family: 'Evolventa';
    src: url('fonts/evolventa-regular.woff') format('woff');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Evolventa';
    src: url('fonts/evolventa-bold.woff') format('woff');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #171717;
    --bg-soft: #1f1f22;
    --panel: #232327;
    --line: #3e3e40;
    --text: #f7f7f7;
    --muted: #b2b2b2;
    --pink: #f7598d;
    --pink-dark: #d63d72;
    --blue: #5061ec;
    --blue-soft: #8a96f2;
    --lime: #a0db00;
    --lime-dark: #7fb000;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Evolventa', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 28px 8px;
  }
  .title-block { flex: 1 1 auto; min-width: 0; }
  .title-block h1 {
    font-size: clamp(22px, 3.4vw, 34px);
    font-weight: 700;
    line-height: 1.15;
  }
  .title-block h1 .accent { color: var(--pink); }
  .title-block p {
    color: var(--muted);
    font-size: clamp(14px, 1.8vw, 16px);
    margin-top: 4px;
  }
  .logo {
    height: 44px;
    width: auto;
    flex-shrink: 0;
    user-select: none;
  }

  /* ---------- Progress ---------- */
  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 28px 0;
    color: var(--muted);
    font-size: 15px;
  }
  .progress-dots { display: flex; gap: 8px; }
  .dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
    transition: background .25s ease, border-color .25s ease, transform .25s ease;
  }
  .dot.active { border-color: var(--pink); background: var(--pink); transform: scale(1.15); }
  .dot.done { border-color: var(--lime); background: var(--lime); }

  /* ---------- Map ---------- */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px 24px;
  }
  .map-wrap {
    position: relative;
    width: 100%;
    max-width: 1080px;
    border-radius: var(--radius);
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(80,97,236,.14), transparent 60%),
      radial-gradient(900px 420px at 10% 110%, rgba(247,89,141,.12), transparent 60%),
      var(--bg-soft);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  svg#map { display: block; width: 100%; height: auto; }

  .twinkle { animation: twinkle 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .twinkle.d2 { animation-delay: .8s; }
  .twinkle.d3 { animation-delay: 1.6s; }
  @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  .trail {
    fill: none;
    stroke: var(--line);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 2 16;
  }
  .seg {
    fill: none;
    stroke: var(--blue-soft);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    transition: stroke-dashoffset 1.1s ease-out;
    filter: drop-shadow(0 0 6px rgba(138,150,242,.55));
  }
  .seg.drawn { stroke-dashoffset: 0; }

  .point { cursor: default; transform-box: fill-box; transform-origin: center; }
  .point .halo { opacity: 0; }
  .point.locked { opacity: 0; pointer-events: none; transition: opacity .4s ease; }
  .point.reveal .pop { animation: pop-in .5s ease-out both; }
  .pop { transform-box: fill-box; transform-origin: center; }
  @keyframes pop-in {
    0% { opacity: 0; transform: scale(.3); }
    70% { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }
  .point.active { cursor: pointer; }
  .point.active .halo {
    opacity: 1;
    animation: halo 1.6s ease-in-out infinite;
    transform-box: fill-box; transform-origin: center;
  }
  @keyframes halo {
    0%,100% { transform: scale(1); opacity: .5; }
    50% { transform: scale(1.35); opacity: 0; }
  }
  .point.active:hover .core, .point.active:focus-visible .core { filter: brightness(1.15); }
  .point:focus-visible { outline: none; }
  .point:focus-visible .focus-ring { opacity: 1; }
  .point .focus-ring { opacity: 0; fill: none; stroke: #fff; stroke-width: 3; stroke-dasharray: 6 6; }
  .point.solved .core { fill: var(--lime); stroke: var(--lime-dark); }
  .point.solved .num { display: none; }
  .point.solved .check { display: block; }
  .point .check { display: none; }

  .finish { opacity: 0; transition: opacity .5s ease; }
  .finish.reveal { opacity: 1; }
  .finish.reveal .pop { animation: pop-in .6s ease-out both; }
  .finish .star-spin { animation: star-glow 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes star-glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  .map-caption {
    position: absolute;
    right: 20px; bottom: 14px;
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,12,.72);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.open { display: flex; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 32px 28px;
    width: 100%;
    max-width: 460px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    animation: card-in .28s ease-out both;
    position: relative;
  }
  @keyframes card-in {
    from { opacity: 0; transform: scale(.95) translateY(12px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .card.shake { animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .card .step-tag {
    display: inline-block;
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--blue-soft);
    border: 1px solid var(--blue);
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 18px;
  }
  .card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .card .sub { color: var(--muted); font-size: 15px; margin-bottom: 20px; }

  .example {
    font-size: clamp(40px, 8vw, 56px);
    font-weight: 700;
    margin: 8px 0 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .example .eq-num { color: var(--pink); }

  .answer-input {
    width: 120px;
    font-family: inherit;
    font-size: clamp(36px, 7vw, 48px);
    font-weight: 700;
    text-align: center;
    color: var(--text);
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 4px 8px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .answer-input::-webkit-outer-spin-button,
  .answer-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .answer-input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(247,89,141,.25); }
  .answer-input.wrong { border-color: var(--pink); background: rgba(247,89,141,.12); }
  .answer-input.right { border-color: var(--lime); background: rgba(160,219,0,.12); }

  .feedback { min-height: 44px; font-size: 15px; margin-bottom: 16px; line-height: 1.45; }
  .feedback.err { color: var(--pink); }
  .feedback.ok { color: var(--lime); }

  .btn {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 14px 34px;
    min-height: 48px;
    cursor: pointer;
    color: #fff;
    background: var(--pink);
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
    box-shadow: 0 6px 18px rgba(247,89,141,.35);
  }
  .btn:hover { background: var(--pink-dark); transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn.blue { background: var(--blue); box-shadow: 0 6px 18px rgba(80,97,236,.35); }
  .btn.blue:hover { background: #3f4ecf; }

  .card .close-btn {
    position: absolute;
    top: 12px; right: 12px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .card .close-btn:hover { color: var(--text); border-color: var(--muted); }
  .card .close-btn:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

  /* ---------- Final card ---------- */
  .final-icon { width: 96px; height: 96px; margin: 0 auto 16px; display: block; }
  .final-card h2 { font-size: 28px; margin-bottom: 10px; }
  .final-card h2 .accent { color: var(--lime); }
  .final-card h2 .accent-pink { color: var(--pink); }
  .final-card p { color: var(--muted); font-size: 16px; line-height: 1.55; margin-bottom: 22px; }
  .stars-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
  .stars-row svg { width: 44px; height: 44px; animation: pop-in .5s ease-out both; }
  .stars-row svg:nth-child(2) { animation-delay: .15s; }
  .stars-row svg:nth-child(3) { animation-delay: .3s; }

  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    display: none;
  }

  @media (max-width: 560px) {
    header { padding: 14px 16px 4px; }
    .logo { height: 34px; }
    .progress { padding: 4px 16px 0; }
    .card { padding: 24px 20px 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .twinkle, .point.active .halo, .finish .star-spin { animation: none; }
    .seg { transition: none; }
    .card, .point.reveal .pop, .finish.reveal .pop, .stars-row svg { animation: none; }
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Космический квест: <span class="accent">таблица умножения на 6</span></h1>
    <p>Помоги роботу Ботику добраться до звезды — решай примеры на каждой станции!</p>
  </div>
  <img class="logo" src="logo-white.png" alt="Логотип школы Rebotica" />
</header>

<div class="progress" aria-live="polite">
  <div class="progress-dots" id="dots">
    <span class="dot" data-i="0"></span>
    <span class="dot" data-i="1"></span>
    <span class="dot" data-i="2"></span>
  </div>
  <span id="progress-text">Пройдено 0 из 3 станций</span>
</div>

<main>
  <div class="map-wrap">
    <svg id="map" viewBox="0 0 1000 560" role="img" aria-label="Карта квеста с тремя станциями">
      <!-- decorative stars -->
      <g fill="#8a96f2">
        <circle class="twinkle" cx="120" cy="90" r="3"/>
        <circle class="twinkle d2" cx="240" cy="180" r="2.4"/>
        <circle class="twinkle d3" cx="430" cy="80" r="3.4"/>
        <circle class="twinkle" cx="620" cy="140" r="2.2"/>
        <circle class="twinkle d2" cx="830" cy="70" r="3"/>
        <circle class="twinkle d3" cx="940" cy="300" r="2.6"/>
        <circle class="twinkle" cx="70" cy="300" r="2.4"/>
        <circle class="twinkle d2" cx="380" cy="500" r="2.8"/>
        <circle class="twinkle d3" cx="680" cy="510" r="2.2"/>
        <circle class="twinkle" cx="880" cy="460" r="3.2"/>
      </g>
      <g fill="#f7598d" opacity=".8">
        <circle class="twinkle d2" cx="520" cy="60" r="2.6"/>
        <circle class="twinkle" cx="180" cy="520" r="2.6"/>
        <circle class="twinkle d3" cx="770" cy="390" r="2.2"/>
      </g>
      <!-- small planet -->
      <g transform="translate(160,120)" opacity=".9">
        <circle r="26" fill="#5061ec"/>
        <ellipse rx="40" ry="10" fill="none" stroke="#8a96f2" stroke-width="4" transform="rotate(-18)"/>
        <circle cx="-8" cy="-6" r="5" fill="#3f4ecf"/>
        <circle cx="9" cy="7" r="3.4" fill="#3f4ecf"/>
      </g>
      <g transform="translate(860,330)" opacity=".85">
        <circle r="18" fill="#f7598d"/>
        <circle cx="-5" cy="-4" r="3.4" fill="#d63d72"/>
        <circle cx="6" cy="5" r="2.4" fill="#d63d72"/>
      </g>

      <!-- faint full trail -->
      <path class="trail" d="M95,465 C170,465 230,395 305,335"/>
      <path class="trail" d="M305,335 C375,270 455,485 525,435"/>
      <path class="trail" d="M525,435 C595,375 665,320 745,255"/>
      <path class="trail" d="M745,255 C805,205 855,175 915,135"/>

      <!-- animated segments -->
      <path class="seg" id="seg0" pathLength="1" d="M95,465 C170,465 230,395 305,335"/>
      <path class="seg" id="seg1" pathLength="1" d="M305,335 C375,270 455,485 525,435"/>
      <path class="seg" id="seg2" pathLength="1" d="M525,435 C595,375 665,320 745,255"/>
      <path class="seg" id="seg3" pathLength="1" d="M745,255 C805,205 855,175 915,135"/>

      <!-- start: robot Botik -->
      <g transform="translate(95,465)">
        <g class="start-robot">
          <rect x="-26" y="-26" width="52" height="48" rx="14" fill="#f7f7f7"/>
          <rect x="-4" y="-40" width="8" height="14" rx="4" fill="#f7f7f7"/>
          <circle cx="0" cy="-42" r="5" fill="#f7598d"/>
          <circle cx="-11" cy="-6" r="6" fill="#171717"/>
          <circle cx="11" cy="-6" r="6" fill="#171717"/>
          <circle cx="-9" cy="-8" r="2" fill="#fff"/>
          <circle cx="13" cy="-8" r="2" fill="#fff"/>
          <circle cx="0" cy="10" r="7" fill="#f7598d"/>
          <rect x="-34" y="-14" width="8" height="20" rx="4" fill="#f7f7f7"/>
          <rect x="26" y="-14" width="8" height="20" rx="4" fill="#f7f7f7"/>
        </g>
        <text y="52" text-anchor="middle" fill="#b2b2b2" font-size="16" font-weight="700">СТАРТ</text>
      </g>

      <!-- points -->
      <g class="point locked" id="point0" transform="translate(305,335)" role="button" tabindex="-1" aria-label="Станция 1">
        <g class="pop">
          <circle class="halo" r="34" fill="rgba(247,89,141,.35)"/>
          <circle class="focus-ring" r="33"/>
          <circle class="core" r="24" fill="#f7598d" stroke="#d63d72" stroke-width="3"/>
          <text class="num" y="8" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">1</text>
          <path class="check" d="M-9,1 L-2,8 L10,-7" stroke="#171717" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <g class="point locked" id="point1" transform="translate(525,435)" role="button" tabindex="-1" aria-label="Станция 2">
        <g class="pop">
          <circle class="halo" r="34" fill="rgba(247,89,141,.35)"/>
          <circle class="focus-ring" r="33"/>
          <circle class="core" r="24" fill="#f7598d" stroke="#d63d72" stroke-width="3"/>
          <text class="num" y="8" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2</text>
          <path class="check" d="M-9,1 L-2,8 L10,-7" stroke="#171717" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <g class="point locked" id="point2" transform="translate(745,255)" role="button" tabindex="-1" aria-label="Станция 3">
        <g class="pop">
          <circle class="halo" r="34" fill="rgba(247,89,141,.35)"/>
          <circle class="focus-ring" r="33"/>
          <circle class="core" r="24" fill="#f7598d" stroke="#d63d72" stroke-width="3"/>
          <text class="num" y="8" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">3</text>
          <path class="check" d="M-9,1 L-2,8 L10,-7" stroke="#171717" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- finish star -->
      <g class="finish" id="finish" transform="translate(915,135)">
        <g class="pop">
          <g class="star-spin">
            <path d="M0,-30 L8,-9 L30,-9 L12,4 L19,26 L0,12 L-19,26 L-12,4 L-30,-9 L-8,-9 Z"
                  fill="#a0db00" stroke="#7fb000" stroke-width="3" stroke-linejoin="round"/>
          </g>
          <text y="52" text-anchor="middle" fill="#a0db00" font-size="16" font-weight="700">ФИНИШ</text>
        </g>
      </g>
    </svg>
    <div class="map-caption">Нажми на розовую станцию, чтобы получить пример</div>
  </div>
</main>

<!-- Example modal -->
<div class="overlay" id="task-overlay" role="dialog" aria-modal="true" aria-labelledby="task-title">
  <div class="card" id="task-card">
    <button class="close-btn" id="task-close" aria-label="Закрыть">×</button>
    <span class="step-tag" id="task-tag">Станция 1 из 3</span>
    <h2 id="task-title">Реши пример, чтобы лететь дальше</h2>
    <p class="sub">Впиши ответ и нажми «Проверить»</p>
    <div class="example">
      <span id="example-text">6 × 3 =</span>
      <input class="answer-input" id="answer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="Твой ответ" />
    </div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button class="btn" id="check-btn">Проверить</button>
  </div>
</div>

<!-- Final modal -->
<div class="overlay" id="final-overlay" role="dialog" aria-modal="true" aria-labelledby="final-title">
  <div class="card final-card" id="final-card">
    <div id="final-content"></div>
    <button class="btn blue" id="restart-btn">Играть снова</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
(function () {
  'use strict';

  var TOTAL = 3;
  var state = { step: 0, errors: 0, examples: [], finished: false };

  var dots = document.querySelectorAll('#dots .dot');
  var progressText = document.getElementById('progress-text');
  var taskOverlay = document.getElementById('task-overlay');
  var taskCard = document.getElementById('task-card');
  var taskTag = document.getElementById('task-tag');
  var exampleText = document.getElementById('example-text');
  var answerInput = document.getElementById('answer');
  var feedback = document.getElementById('feedback');
  var checkBtn = document.getElementById('check-btn');
  var taskClose = document.getElementById('task-close');
  var finalOverlay = document.getElementById('final-overlay');
  var finalContent = document.getElementById('final-content');
  var restartBtn = document.getElementById('restart-btn');
  var confettiCanvas = document.getElementById('confetti');

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function pointEl(i) { return document.getElementById('point' + i); }

  function updateProgress() {
    dots.forEach(function (d, i) {
      d.classList.toggle('done', i < state.step);
      d.classList.toggle('active', i === state.step && !state.finished);
    });
    progressText.textContent = 'Пройдено ' + state.step + ' из ' + TOTAL + ' станций';
  }

  function unlockPoint(i) {
    var p = pointEl(i);
    p.classList.remove('locked');
    p.classList.add('reveal', 'active');
    p.setAttribute('tabindex', '0');
  }

  function solvePoint(i) {
    var p = pointEl(i);
    p.classList.remove('active');
    p.classList.add('solved');
    p.setAttribute('tabindex', '-1');
    p.setAttribute('aria-label', 'Станция ' + (i + 1) + ' пройдена');
  }

  function newGame() {
    state.step = 0;
    state.errors = 0;
    state.finished = false;
    state.examples = shuffle([2, 3, 4, 5, 6, 7, 8, 9]).slice(0, TOTAL);

    for (var i = 0; i < TOTAL; i++) {
      var p = pointEl(i);
      p.classList.add('locked');
      p.classList.remove('reveal', 'active', 'solved');
      p.setAttribute('tabindex', '-1');
      p.setAttribute('aria-label', 'Станция ' + (i + 1));
      document.getElementById('seg' + i).classList.remove('drawn');
    }
    document.getElementById('seg3').classList.remove('drawn');
    var fin = document.getElementById('finish');
    fin.classList.remove('reveal');

    unlockPoint(0);
    updateProgress();
  }

  function openTask() {
    var mult = state.examples[state.step];
    taskTag.textContent = 'Станция ' + (state.step + 1) + ' из ' + TOTAL;
    exampleText.innerHTML = '6 × ' + mult + ' =';
    answerInput.value = '';
    answerInput.classList.remove('wrong', 'right');
    feedback.textContent = '';
    feedback.className = 'feedback';
    taskOverlay.classList.add('open');
    setTimeout(function () { answerInput.focus(); }, 60);
  }

  function closeTask() { taskOverlay.classList.remove('open'); }

  function hintFor(mult) {
    var parts = [];
    for (var i = 0; i < mult; i++) parts.push('6');
    return 'Подсказка: 6 × ' + mult + ' — это ' + parts.join(' + ');
  }

  function checkAnswer() {
    var mult = state.examples[state.step];
    var right = 6 * mult;
    var val = answerInput.value.trim();

    if (val === '') {
      feedback.textContent = 'Сначала впиши ответ';
      feedback.className = 'feedback err';
      answerInput.focus();
      return;
    }

    if (parseInt(val, 10) === right) {
      answerInput.classList.remove('wrong');
      answerInput.classList.add('right');
      feedback.textContent = 'Верно! 6 × ' + mult + ' = ' + right + '. Летим дальше!';
      feedback.className = 'feedback ok';
      checkBtn.disabled = true;
      setTimeout(function () {
        checkBtn.disabled = false;
        closeTask();
        advance();
      }, 900);
    } else {
      state.errors++;
      answerInput.classList.remove('right');
      answerInput.classList.add('wrong');
      taskCard.classList.remove('shake');
      void taskCard.offsetWidth;
      taskCard.classList.add('shake');
      feedback.textContent = 'Не совсем. ' + hintFor(mult);
      feedback.className = 'feedback err';
      answerInput.select();
      answerInput.focus();
    }
  }

  function advance() {
    var i = state.step;
    solvePoint(i);
    document.getElementById('seg' + i).classList.add('drawn');
    state.step++;
    updateProgress();

    if (state.step < TOTAL) {
      setTimeout(function () { unlockPoint(state.step); }, 650);
    } else {
      document.getElementById('seg3').classList.add('drawn');
      var fin = document.getElementById('finish');
      setTimeout(function () { fin.classList.add('reveal'); }, 650);
      state.finished = true;
      updateProgress();
      setTimeout(showFinal, 1500);
    }
  }

  function showFinal() {
    var ok = state.errors === 0;
    if (ok) {
      finalContent.innerHTML =
        '<div class="stars-row">' +
        starSvg() + starSvg() + starSvg() +
        '</div>' +
        '<h2 id="final-title"><span class="accent">Поздравляем!</span></h2>' +
        '<p>Ты прошёл все 3 станции без единой ошибки и помог Ботику добраться до звезды. ' +
        'Таблица умножения на 6 покорена!</p>';
      finalOverlay.classList.add('open');
      launchConfetti();
    } else {
      finalContent.innerHTML =
        '<h2 id="final-title"><span class="accent-pink">Тебе стоит повторить</span></h2>' +
        '<p>Ботик почти добрался! В этот раз были ошибки — повтори таблицу умножения на 6 ' +
        'и пройди квест ещё раз. У тебя обязательно получится!</p>';
      finalOverlay.classList.add('open');
    }
    restartBtn.focus();
  }

  function starSvg() {
    return '<svg viewBox="0 0 44 44" aria-hidden="true"><path d="M22,3 L27,15 L40,16 L30,25 L33,38 L22,31 L11,38 L14,25 L4,16 L17,15 Z" fill="#a0db00" stroke="#7fb000" stroke-width="2" stroke-linejoin="round"/></svg>';
  }

  /* ---------- Confetti ---------- */
  var confettiRunning = false;
  function launchConfetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var ctx = confettiCanvas.getContext('2d');
    confettiCanvas.style.display = 'block';
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
    var colors = ['#f7598d', '#5061ec', '#8a96f2', '#a0db00', '#f7f7f7'];
    var parts = [];
    for (var i = 0; i < 140; i++) {
      parts.push({
        x: Math.random() * confettiCanvas.width,
        y: -20 - Math.random() * confettiCanvas.height * .5,
        w: 6 + Math.random() * 7,
        h: 8 + Math.random() * 8,
        c: colors[i % colors.length],
        vy: 2 + Math.random() * 3,
        vx: -1.5 + Math.random() * 3,
        rot: Math.random() * Math.PI,
        vr: -.1 + Math.random() * .2
      });
    }
    confettiRunning = true;
    var start = performance.now();
    function frame(now) {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (now - start < 3600) {
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiCanvas.style.display = 'none';
        confettiRunning = false;
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Events ---------- */
  for (var i = 0; i < TOTAL; i++) {
    (function (idx) {
      var p = pointEl(idx);
      p.addEventListener('click', function () {
        if (idx === state.step && !state.finished) openTask();
      });
      p.addEventListener('keydown', function (e) {
        if ((e.key === 'Enter' || e.key === ' ') && idx === state.step && !state.finished) {
          e.preventDefault();
          openTask();
        }
      });
    })(i);
  }

  checkBtn.addEventListener('click', checkAnswer);
  answerInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); }
  });
  answerInput.addEventListener('input', function () {
    answerInput.value = answerInput.value.replace(/[^0-9]/g, '');
    answerInput.classList.remove('wrong');
  });
  taskClose.addEventListener('click', closeTask);
  taskOverlay.addEventListener('click', function (e) {
    if (e.target === taskOverlay) closeTask();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && taskOverlay.classList.contains('open')) closeTask();
  });

  restartBtn.addEventListener('click', function () {
    finalOverlay.classList.remove('open');
    newGame();
  });

  window.addEventListener('resize', function () {
    if (confettiRunning) {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
  });

  newGame();
})();
</script>
</body>
</html>
